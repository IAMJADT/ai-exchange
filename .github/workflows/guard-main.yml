name: guard-main

# 作用：任何往 main 的推送，都会检查是否经过合并。
# 未经合并的直接提交 → 自动回滚，并在记录里留痕。
# 安装方式：见 README「守卫机制」一节。

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    # 回滚提交自身不回滚（防循环）；带 [guard-skip] 的放行
    if: |
      !contains(github.event.head_commit.message, '[guard-skip]') &&
      !startsWith(github.event.head_commit.message, 'Revert')

    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 判定这次推送是合并还是直推
        id: judge
        run: |
          SHA="${{ github.event.head_commit.id }}"
          PARENTS=$(git cat-file -p "$SHA" | grep -c '^parent ' || true)
          echo "commit=$SHA parents=$PARENTS"
          if [ "$PARENTS" -ge 2 ]; then
            echo "verdict=merge" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=direct" >> "$GITHUB_OUTPUT"
          fi

      - name: 直推 → 自动回滚 + 留痕
        if: steps.judge.outputs.verdict == 'direct'
        run: |
          SHA="${{ github.event.head_commit.id }}"
          NAME="$(git log -1 --pretty=%an "$SHA")"
          MSG="$(git log -1 --pretty=%s "$SHA")"
          git config user.name "guard-bot"
          git config user.email "guard-bot@users.noreply.github.com"
          git revert --no-edit "$SHA"
          git commit --amend -m "Revert 直推：$MSG

          本次推送未经过合并，违反 README 第六节。已由守卫自动撤销。
          原提交：$SHA
          提交人：$NAME
          [guard-skip]"
          git push origin HEAD:main
          echo "::error::检测到直推，已自动回滚。原提交 $SHA（$NAME）"

      - name: 合并但没说从哪来 → 只告警，不回滚
        if: steps.judge.outputs.verdict == 'merge'
        run: |
          MSG="$(git log -1 --pretty=%s)"
          if ! echo "$MSG" | grep -qE '合并|merge|Merge'; then
            echo "::warning::这是一次合并，但提交信息没写明合并来源：$MSG"
          fi
